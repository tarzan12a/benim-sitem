<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zaman Tüneli - E-posta Doğrulama</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            color: #1f2937;
            text-align: center;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #4b5563;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 11px;
            background-color: #0284c7;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        button:hover {
            background-color: #0369a1;
        }
        #sonucMesaji {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Zaman Tüneli Kayıt</h2>
        <div class="form-group">
            <label for="eposta">E-posta Adresiniz:</label>
            <input type="email" id="eposta" placeholder="ornek@email.com" required>
        </div>
        <button onclick="dogrulamaKoduGonder()">Doğrulama Kodu Gönder</button>
        <p id="sonucMesaji"></p>
    </div>

    <script>
        async function dogrulamaKoduGonder() {
            const epostaInput = document.getElementById('eposta').value;
            const sonucMesaji = document.getElementById('sonucMesaji');

            if (!epostaInput) {
                sonucMesaji.style.color = 'red';
                sonucMesaji.textContent = 'Lütfen geçerli bir e-posta adresi girin.';
                return;
            }

            // 6 haneli rastgele bir doğrulama kodu üretelim
            const rastgeleKod = Math.floor(100000 + Math.random() * 900000).toString();

            sonucMesaji.style.color = '#4b5563';
            sonucMesaji.textContent = 'Kod gönderiliyor, lütfen bekleyin...';

            try {
                // Render üzerinde çalışan canlı sunucu adresimiz
                const response = await fetch('https://uzem-sunucu-zaman-tuneli-yeni.onrender.com/api/send-email', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: epostaInput,
                        code: rastgeleKod
                    })
                });

                const sonuc = await response.json();
                
                if (sonuc.success) {
                    sonucMesaji.style.color = 'green';
                    sonucMesaji.textContent = 'Doğrulama kodu e-posta adresinize başarıyla gönderildi!';
                } else {
                    sonucMesaji.style.color = 'red';
                    sonucMesaji.textContent = 'Hata: ' + (sonuc.error || 'Bilinmeyen bir hata oluştu.');
                }
            } catch (hata) {
                console.error('Bağlantı hatası:', hata);
                sonucMesaji.style.color = 'red';
                sonucMesaji.textContent = 'Sunucuya bağlanılamadı. Lütfen tekrar deneyin.';
            }
        }
    </script>

</body>
</html>
