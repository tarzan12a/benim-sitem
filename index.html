<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zaman Tüneli - YKS Doğrulama</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --card-bg: #ffffff;
            --text-main: #2d3748;
            --text-muted: #718096;
            --input-bg: #f7fafc;
            --input-border: #e2e8f0;
            --primary: #5a67d8;
            --primary-hover: #4c51bf;
            --shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            color: var(--text-main);
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .card {
            background: var(--card-bg);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(10px);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-3px);
        }

        .logo-area {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-area h1 {
            font-size: 26px;
            font-weight: 800;
            color: var(--text-main);
            margin: 0 0 8px 0;
            letter-spacing: -0.5px;
        }

        .logo-area p {
            color: var(--text-muted);
            font-size: 14px;
            margin: 0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            background-color: var(--input-bg);
            border: 2px solid var(--input-border);
            border-radius: 12px;
            box-sizing: border-box;
            font-size: 15px;
            color: var(--text-main);
            transition: all 0.25s ease;
        }

        input:focus {
            border-color: var(--primary);
            background-color: #fff;
            outline: none;
            box-shadow: 0 0 0 4px rgba(90, 103, 216, 0.15);
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 12px rgba(90, 103, 216, 0.3);
        }

        button:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 15px rgba(90, 103, 216, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background-color: #cbd5e0;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        #sonuc {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
            font-weight: 500;
            min-height: 20px;
        }

        .footer-text {
            text-align: center;
            margin-top: 25px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.8);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <div class="logo-area">
                <h1>Zaman Tüneli</h1>
                <p>YKS Hedefine Bir Adım Daha Yaklaş 🎯</p>
            </div>
            
            <form id="emailForm">
                <div class="form-group">
                    <label for="email">E-Posta Adresin</label>
                    <input type="email" id="email" required placeholder="ornek@ogrenci.com">
                </div>
                <button type="submit" id="submitBtn">Doğrulama Kodu Gönder</button>
            </form>
            
            <div id="sonuc"></div>
        </div>
        <div class="footer-text">
            YKS Hazırlık Portalı © 2026
        </div>
    </div>

    <script>
        const form = document.getElementById('emailForm');
        const submitBtn = document.getElementById('submitBtn');
        const sonucDiv = document.getElementById('sonuc');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const rastgeleKod = Math.floor(100000 + Math.random() * 900000);

            submitBtn.disabled = true;
            submitBtn.textContent = 'Gönderiliyor...';
            sonucDiv.style.color = '#4a5568';
            sonucDiv.textContent = 'Kod e-postana yola çıkıyor...';

            try {
                // Render canlı sunucu adresiniz
                const response = await fetch('https://uzem-sunucu-zaman-tuneli-yeni.onrender.com/api/send-email', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email: email, code: rastgeleKod })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    sonucDiv.style.color = '#38a169';
                    sonucDiv.textContent = '✨ Doğrulama kodu başarıyla gönderildi!';
                } else {
                    sonucDiv.style.color = '#e53e3e';
                    sonucDiv.textContent = '⚠️ Hata: ' + (data.error || 'İşlem başarısız.');
                }
            } catch (error) {
                sonucDiv.style.color = '#e53e3e';
                sonucDiv.textContent = '🌐 Sunucuya bağlanırken bir sorun oluştu.';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Doğrulama Kodu Gönder';
            }
        });
    </script>

</body>
</html>
