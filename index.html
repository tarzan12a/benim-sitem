<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zaman Tüneli - E-Posta Doğrulama</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 380px;
            box-sizing: border-box;
        }
        h2 {
            margin-top: 0;
            color: #333;
            text-align: center;
            margin-bottom: 24px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-size: 14px;
            font-weight: 600;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        input:focus {
            border-color: #007bff;
            outline: none;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #0056b3;
        }
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        #sonuc {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Zaman Tüneli</h2>
        <form id="emailForm">
            <div class="form-group">
                <label for="email">E-Posta Adresi</label>
                <input type="email" id="email" required placeholder="ornek@email.com">
            </div>
            <button type="submit" id="submitBtn">Doğrulama Kodu Gönder</button>
        </form>
        <div id="sonuc"></div>
    </div>

    <script>
        const form = document.getElementById('emailForm');
        const submitBtn = document.getElementById('submitBtn');
        const sonucDiv = document.getElementById('sonuc');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const rastgeleKod = Math.floor(100000 + Math.random() * 900000); // 6 haneli rastgele kod

            // Butonu kilitle ve bilgi ver
            submitBtn.disabled = true;
            submitBtn.textContent = 'Gönderiliyor...';
            sonucDiv.style.color = '#555';
            sonucDiv.textContent = 'E-posta gönderim işlemi başlatıldı...';

            try {
                // Render üzerindeki canlı API adresiniz
                const response = await fetch('https://uzem-sunucu-zaman-tuneli-yeni.onrender.com/api/send-email', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email: email, code: rastgeleKod })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    sonucDiv.style.color = '#28a745';
                    sonucDiv.textContent = 'Doğrulama kodu başarıyla e-postanıza gönderildi!';
                } else {
                    sonucDiv.style.color = '#dc3545';
                    sonucDiv.textContent = 'Hata: ' + (data.error || 'İşlem başarısız oldu.');
                }
            } catch (error) {
                sonucDiv.style.color = '#dc3545';
                sonucDiv.textContent = 'Sunucuyla bağlantı kurulamadı. Lütfen tekrar deneyin.';
            } finally {
                // Butonu eski haline getir
                submitBtn.disabled = false;
                submitBtn.textContent = 'Doğrulama Kodu Gönder';
            }
        });
    </script>

</body>
</html>
